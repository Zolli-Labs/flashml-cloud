# FlashML Cloud — Render Blueprint (M1 deployed POC)
#
# Three services from ONE repo. Create once with: Render dashboard -> New ->
# Blueprint -> point at this repo. Render reads this file and provisions
# everything.
#
# WHERE flashruntime COMES FROM (changed 2026-08-01): the public monorepo
# github.com/Zolli-Labs/flashml. It used to live in THIS repo as a git subtree
# alongside a second copy in a public mirror, kept in sync by hand with
# `git subtree split` + push. That arrangement shipped a real bug — the
# coordinator ran one copy and volunteers installed another — so it is gone.
# Both services below install it as an ordinary pinned dependency; the repo is
# public, so no build-time credentials are involved.
#
# There is exactly one copy of the runtime now. Do not add another.
#
# WHY A BLUEPRINT AND NOT THE DASHBOARD/API: the coordinator must be a
# PRIVATE service with a persistent disk. Render's MCP tooling can only
# create public web services with no disk, so the one service whose privacy
# the entire security model depends on cannot be created that way. A
# blueprint can declare it, and does so here in version control where the
# choice is reviewable.
#
# ---------------------------------------------------------------------------
# THE LOAD-BEARING DECISION: flashml-coordinator is `type: pserv` (private).
#
# It has no public URL and is reachable only from the other services in this
# workspace. That is not a hardening nicety — it is the assumption every
# other security property rests on:
#
#   * flashml-api holds an OPERATOR credential that is deliberately UNSCOPED.
#     It can act as any machine, because it is the only component that can
#     authenticate machines at all (the coordinator has no database and
#     machines are enrolled at runtime in Postgres). Anyone who could reach
#     the coordinator directly with that token could act as every machine.
#   * The coordinator runs ONE uvicorn worker. LeaseManager and
#     SqliteLeaseStore are safe only on a single event loop (HANDOFF.md risk
#     #5). A public service invites autoscaling, which would break that
#     silently.
#   * Lease-scoped writes are enforced coordinator-side against the caller's
#     live leases. That confinement is meaningful only if every caller
#     arrives through the API.
#
# If you ever change `pserv` to `web`, you have undone Plans 2 and 3.
# ---------------------------------------------------------------------------

services:
  # -------------------------------------------------------------------------
  # 1. The coordinator — PRIVATE. No public URL.
  # -------------------------------------------------------------------------
  - type: pserv
    name: flashml-coordinator
    runtime: python
    # DEPLOYS ARE GATED BY CI (2026-08-02). See .github/workflows/ci.yml.
    #
    # Until today all three services ran `autoDeploy: yes` with Render's
    # `commit` trigger and this repository had no CI at all, so every commit
    # that reached `main` deployed to production without the 419 API tests,
    # the 61 e2e tests or the 26 web tests ever running.
    #
    # Render's own `checksPass` trigger would also fix that, but it is a
    # dashboard/API setting with no blueprint field, so it could be neither
    # reviewed in a diff nor set from version control. Turning auto-deploy
    # off entirely and letting the workflow call the Render API keeps the
    # whole rule in one reviewable place.
    #
    # Break-glass: a manual deploy from the Render dashboard still works.
    autoDeploy: false
    # rootDir was `flashruntime` — a directory in THIS repo. It is gone: the
    # runtime now lives in the public Zolli-Labs/flashml monorepo and installs
    # like any other dependency. There is no longer a copy of it here to drift.
    rootDir: .
    plan: starter          # free tier has no private services and no disks
    region: oregon
    # An exact version from PyPI. FOUR sites carry it and all four must move
    # together: this line, the dev coordinator's buildCommand below,
    # flashml-cloud/apps/api/pyproject.toml, and RUNTIME_VERSION in the
    # Makefile. (The dev coordinator joined on 2026-08-02, so the comments
    # that said "three places" and named a `FLASHML_PIN` variable that no
    # longer exists were both out of date.) The API and the coordinator
    # speaking different protocol versions is the exact failure this
    # consolidation exists to prevent.
    buildCommand: pip install "flashruntime[service]==0.6.1"
    # --workers 1 is REQUIRED, not a default. See HANDOFF.md risk #5.
    startCommand: >-
      FLASHML_OPERATOR_TOKENS="flashml-api:$OPERATOR_TOKEN"
      uvicorn flashruntime.service.app:app
      --host 0.0.0.0 --port $PORT --workers 1
    # NO healthCheckPath HERE. Render rejects the blueprint outright with
    # "pserv service type cannot have a health check path" — a private
    # service has no ingress for the probe to arrive on, so there is nothing
    # to health-check from Render's side. The coordinator DOES serve
    # /healthz; it is simply only reachable from flashml-api, which is the
    # whole point of `pserv`. Liveness is therefore observed through the API
    # (whose own /healthz is checked below) and the deploy logs, not by
    # Render probing this service. Do not "fix" this by switching to
    # `type: web` to get the health check back — that would undo Plans 2
    # and 3, as the header comment explains.
    disk:
      # leases.db and locally-hosted artifacts live here. Without a disk, a
      # restart loses every in-flight lease and every committed artifact.
      name: flashml-coordinator-data
      mountPath: /data
      sizeGB: 5
    envVars:
      # Generated once by Render and never seen by a human. The API reads it
      # back via fromService below, so the two always agree.
      - key: OPERATOR_TOKEN
        generateValue: true
      # Refuses to BOOT if no tokens are configured — so a misconfigured
      # deploy fails loudly instead of quietly running unauthenticated.
      - key: FLASHML_REQUIRE_NODE_AUTH
        value: "1"
      - key: FLASHML_LEDGER_PATH
        value: /data/ledger.db
      - key: FLASHML_LOCAL_ARTIFACTS_DIR
        value: /data/artifacts
      - key: FLASHML_ENABLE_KUBERAY
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11"

  # -------------------------------------------------------------------------
  # 2. The API — public. The ONLY door to the coordinator.
  # -------------------------------------------------------------------------
  - type: web
    name: flashml-api
    # Deploys gated by CI — see the note on flashml-coordinator above and
    # .github/workflows/ci.yml.
    autoDeploy: false
    runtime: python
    rootDir: flashml-cloud/apps/api
    plan: starter          # must not sleep: a suspended API strands every agent
    region: oregon
    # flashruntime is an ordinary dependency now, declared in
    # apps/api/pyproject.toml and pinned to an exact PUBLISHED version. No
    # relative path, no second copy in this repo, nothing to keep in sync by
    # hand. (It was briefly a commit pin, while flashruntime existed only in
    # git; that escape hatch is documented in the foundation spec §3.3 and is
    # forbidden in a release.)
    #
    # The previous comment here claimed the published wheel was stale and
    # predated `build_round`. That was wrong: flashruntime had NEVER been
    # published — https://pypi.org/pypi/flashruntime/json returned 404
    # (verified 2026-08-01). The relative-path install was working around a
    # problem that did not exist, and in doing so created a real one.
    buildCommand: pip install -e .
    startCommand: uvicorn flashml_cloud_api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: REQUIRE_AUTH
        value: "1"
      # Internal hostname — resolvable only inside this workspace.
      - key: COORDINATOR_URL
        fromService:
          type: pserv
          name: flashml-coordinator
          property: hostport
      # Same generated value the coordinator uses. Never typed by hand.
      - key: COORDINATOR_OPERATOR_TOKEN
        fromService:
          type: pserv
          name: flashml-coordinator
          envVarKey: OPERATOR_TOKEN
      # sync: false => Render prompts for these at blueprint creation and
      # never stores them in git.
      #
      # REQUIRED. The API derives the JWKS endpoint from this
      # (`{SUPABASE_URL}/auth/v1/.well-known/jwks.json`) and verifies every
      # browser token against the public key published there. Missing => the
      # API refuses to boot.
      - key: SUPABASE_URL
        sync: false
      # OPTIONAL, and legacy — kept only for HS256 projects. This project's
      # CURRENT signing key is ECC (P-256), so every newly-issued token is
      # ES256 and needs no shared secret; leave this blank. Set it only to
      # keep not-yet-expired tokens signed by a PREVIOUS HS256 key working
      # through a rotation, or when pointing the API at a self-hosted or
      # older project that still signs symmetrically.
      - key: SUPABASE_JWT_SECRET
        sync: false
      # SUPABASE_SERVICE_KEY IS DELIBERATELY NOT DECLARED HERE.
      #
      # No code path reads it. The API reaches Postgres directly over libpq
      # (DATABASE_URL, below) and verifies tokens against the JWKS — it never
      # calls PostgREST or the Auth Admin API, which are the only consumers a
      # service-role key has. It is the one credential that bypasses every RLS
      # policy and every owner-scoped query in db.py, so putting it into a
      # service with no use for it is pure downside. If a Storage or Admin-API
      # caller ever lands, add it back here AND to the required list in
      # settings.from_env at the same time.
      #
      # REQUIRED. Standard libpq URI. Use Supabase's SESSION POOLER string
      # (`...pooler.supabase.com:5432`, user `postgres.<project-ref>`), not
      # "Direct connection": direct is IPv6-only on current projects and
      # Render's outbound network may not route it, which surfaces as a
      # connection failure well after a deploy that otherwise looks healthy.
      # USE THE TRANSACTION POOLER (:6543), not the session pooler (:5432).
      # This reverses the previous comment's advice, deliberately, after the
      # 2026-08-13 dev outage: the session pooler hard-caps at 15 clients,
      # the API opens a connection per request, and the first night with a
      # real fleet (three workers + a polling console) exhausted the cap —
      # requests hung, /healthz blew Render's 5s budget, and the instance
      # restart-looped, 502-ing every worker into lease loss.
      #
      # The prepared-statement breakage that comment rightly feared is
      # closed in code: db.connect() passes prepare_threshold=None (safe on
      # both ports, shipped BEFORE any URL moved). Do not flip this port
      # without that line present in the running build.
      #
      # A port is still a capacity patch. If the bounded connection pool
      # (2026-08-13 findings, API-design follow-ups) is not landed before
      # prod carries a fleet, this port IS the load-bearing mitigation —
      # treat it as required, not optional.
      # Percent-encode any special character in the password (`@` -> %40,
      # `#` -> %23, `/` -> %2F, `:` -> %3A) or the URI parses wrong.
      - key: DATABASE_URL
        sync: false
      # See the dev API service below for the full reasoning: `flashnode
      # login` prints this into a terminal on a volunteer's own machine, and
      # the relative "/activate" fallback is not something they can act on
      # there — there is no current host to resolve it against.
      #
      # The Render-assigned host, because that is what this blueprint
      # actually declares. If a custom domain (zolliai.com) is attached to
      # flashml-web in the dashboard, change this to match it: whatever a
      # volunteer is told to open has to be a host that answers.
      - key: FLASHML_CONSOLE_URL
        value: https://zolliai.com
      # THIS API's own public address, as reached from OUTSIDE our network.
      #
      # The FlashNode running inside an Alibaba FC Sandbox enrols against it.
      # It cannot be COORDINATOR_URL, for two separate reasons and either one
      # alone is fatal: the sandbox authenticates with a MACHINE TOKEN, which
      # is a cloud-API concept the coordinator has no notion of; and the
      # coordinator is `type: pserv`, a PRIVATE service whose whole purpose is
      # that nothing outside this network can reach it. A sandbox in Singapore
      # cannot route to it at all.
      #
      # Unset, `sandbox_orchestrator.start_session` falls back to
      # COORDINATOR_URL — correct for a single-host dev loop, wrong here. The
      # failure then looks like a bootstrap timeout rather than a
      # misconfiguration, which is the expensive kind of wrong.
      #
      # An explicit URL, not `fromService`, matching FLASHML_CONSOLE_URL above
      # and NEXT_PUBLIC_CLOUD_API on the web service — all three name the same
      # public hosts and are read together.
      - key: FLASHML_PUBLIC_API_URL
        value: https://api.zolliai.com
      - key: PYTHON_VERSION
        value: "3.11"
      # Mail. The API sends two product emails — access approved and access
      # declined. Absent, it boots and serves and sends nothing: a missing
      # provider must not take the API down, so these are NOT in
      # settings.from_env's required list.
      #
      # Supabase's own SMTP setting is separate and governs AUTH mail
      # (password reset, confirmation) — it is configured in the Supabase
      # dashboard, not here, and points at the same Resend account.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "FlashML <no-reply@zolliai.com>"
      # MUST be a mailbox that actually RECEIVES mail. Resend's domain
      # verification proves `zolliai.com` can SEND — DKIM plus an SPF/MX pair
      # on the `send.` subdomain for bounces — and says nothing about
      # receiving. Verified 2026-08-10: `zolliai.com` has NO MX record, so no
      # address at that domain receives anything today. The declined email's
      # only call to action is "reply to this message" (re-applying is
      # refused by design, see `access-request` 409), so an unresolved
      # reply-to strands exactly the person who most needs a way back in.
      #
      # RESOLVED 2026-08-10: the owner's own monitored inbox. Deliberately
      # NOT an @zolliai.com address — no Workspace account exists on that
      # domain, so any address there would be send-only and would bounce.
      # Reply-To need not sit on the verified sending domain: DKIM/SPF
      # govern `From`, while `Reply-To` only redirects the recipient's
      # reply. Recipients still see "FlashML" as the sender.
      #
      # Swap this for a real support address the day Workspace (or a free
      # forwarder) lands on zolliai.com — one env var, no code change.
      - key: EMAIL_REPLY_TO
        value: "phongct1105@gmail.com"

      # -- GitHub App: reading a submitter's PRIVATE repositories -----------
      #
      # All three or none. `Settings.github_app_configured` is all-or-nothing
      # on purpose: a half-configured App can mint no token, and reporting it
      # as configured would have the console render a Connect button that
      # walks somebody through granting us access to their code and then
      # fails. Absent, private repos are simply unavailable and public ones
      # work exactly as before — so, like the mail vars above, these are NOT
      # in settings.from_env's required list.
      #
      # This is a SECOND GitHub registration, unrelated to Supabase's GitHub
      # sign-in provider. Supabase stays identity-only. An OAuth `repo` scope
      # would be all-or-nothing, tied to one person's account, and would
      # tangle sign-in with authorization — see the spec's §1.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      # The App's RSA private key. Multi-line PEM: Render's dashboard accepts
      # newlines, but a `.env` file does not, so `_decode_pem` also accepts
      # base64 — store it base64-encoded and one format works everywhere.
      #
      # This is the credential the whole design hangs on. The database holds
      # only installation ids, which are useless without this key; leak it and
      # every connected organisation's private source is readable.
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false

      # -- Alibaba OSS: the artifact mirror ---------------------------------
      #
      # All five or none. `Settings.oss_configured` is all-or-nothing for the
      # same reason the GitHub App above is, and unset is a supported, safe
      # configuration: the mirror does nothing, the coordinator's disk stays
      # the only store, and every path behaves byte for byte as before. So
      # these are NOT in settings.from_env's required list.
      #
      # WHAT THIS BUYS. A committed artifact lives in exactly one place
      # today: the coordinator's own filesystem
      # (FLASHML_LOCAL_ARTIFACTS_DIR), which is the 5 GB disk declared above
      # on prod and NOTHING AT ALL on dev, where it is /tmp on a free
      # instance with no disk — every redeploy destroys every artifact the
      # product has ever produced there. `artifact_mirror.py` copies a
      # finished job's ACCEPTED artifacts to OSS after the fact, on the
      # observation that the job is terminal. It is a second copy, never a
      # replacement: nothing about where the coordinator writes changes, and
      # setting FLASHML_ARTIFACT_BACKEND on the coordinator would not change
      # it either (the runtime's Mode A path never calls store_from_env).
      #
      # THE NAMES MATTER. settings.from_env reads exactly these five —
      # OSS_BUCKET, not FLASHML_OSS_BUCKET. The integration panel used to
      # display the FLASHML_-prefixed name, which meant a fully configured
      # deployment reported an empty bucket and an unconfigured one could be
      # made to look configured by exporting a variable nothing consumed.
      #
      # OSS_REGION is optional and defaults to E2B_REGION / ap-southeast-1;
      # it is declared here so the two Alibaba services cannot silently end
      # up in different regions. Endpoint is HOST ONLY, no scheme:
      # `oss-ap-southeast-1.aliyuncs.com` (alibaba_oss adds https://).
      #
      # THE KEY PAIR IS HELD BY THIS PROCESS AND NOTHING ELSE. A sandbox
      # running user ML code never receives it — it gets presigned, expiring,
      # single-object URLs minted here. Scope the RAM policy to this one
      # bucket; a key that can reach more than the bucket is a key whose leak
      # costs more than the artifacts.
      - key: OSS_BUCKET
        sync: false
      - key: OSS_ENDPOINT
        value: oss-ap-southeast-1.aliyuncs.com
      - key: OSS_REGION
        value: ap-southeast-1
      - key: OSS_ACCESS_KEY_ID
        sync: false
      # sync: false, like every other credential here. Never a value in this
      # file — see the workspace rule that publishable keys are secrets too.
      - key: OSS_ACCESS_KEY_SECRET
        sync: false

      # -- Alibaba FC Agent Sandbox: the evaluation session -----------------
      #
      # All of E2B_API_KEY, FC_SANDBOX_POOL_ID and a region or none.
      # `Settings.fc_sandbox_configured` is all-or-nothing like the two blocks
      # above, and unset is a supported configuration: the sandbox routes
      # answer 404, the reconciler never starts, and nothing else in the API
      # changes shape. So these are NOT in settings.from_env's required list.
      #
      # WHAT THIS BUYS. A sandbox is created, bootstrapped into an enrolled
      # FlashNode, deep-hibernated for however long training takes somewhere
      # else, then woken to evaluate the trained model and killed. The
      # hibernation is the point: its instance is destroyed and its filesystem
      # snapshotted, so the wait costs nothing while the model is being
      # trained on somebody else's machine.
      #
      # E2B_REGION MUST BE ap-southeast-1 AND THERE IS NO SECOND OPTION.
      # Deep hibernation — `pause()` — is enabled in that region and no other;
      # anywhere else the API answers 403 PauseSessionForbidden, forever. A
      # wrong value here does not fail loudly at deploy: sessions are created
      # and bootstrapped normally and then cannot hibernate, which turns a
      # sandbox that should cost nothing during training into one billing by
      # the second for the whole run. `sandbox_orchestrator.start_session`
      # refuses before it creates anything for exactly this reason, so the
      # visible symptom is every session failing at step 2 — but the variable
      # is what decides it. E2B_API_URL and E2B_DOMAIN are DERIVED from this
      # when unset, so a region typo also silently retargets both.
      #
      # FC_SANDBOX_POOL_ID is an ISOLATION pool and it is not advisory. The
      # session mints exactly one machine credential into it, and the
      # coordinator's seventh placement gate refuses a pool-scoped task to any
      # node whose stamp does not list that pool. Point it at a pool that is
      # EMPTY and stays empty — `start_session` refuses to open a session into
      # a pool that already holds a machine, because a second machine in there
      # is a stranger's laptop eligible to claim the evaluation.
      #
      # THE API KEY REACHES ALIBABA, NOT THE SANDBOX. Nothing running user ML
      # code ever receives it; the sandbox gets a one-session machine token
      # and per-object presigned OSS URLs, both revoked by cleanup.
      - key: E2B_API_KEY
        sync: false
      # A LITERAL, deliberately — and this was reversed on 2026-08-11.
      #
      # It was `sync: false` on the reasoning that the region "cannot drift
      # without somebody typing it". That has it exactly backwards: sync:false
      # means somebody MUST type it, once per environment, from memory, into a
      # dashboard field with no validation — and a typo does not fail the
      # deploy. It fails much later, as `403 PauseSessionForbidden`, and the
      # sandbox that should have cost nothing during training bills by the
      # second instead. The value is not a secret and there is exactly one
      # correct answer, so version control is the right place for it.
      - key: E2B_REGION
        value: ap-southeast-1
      - key: FC_SANDBOX_POOL_ID
        sync: false
      # The sandbox image. `code-interpreter-v1` is the default in Settings;
      # declared here so a deployment that needs a different base does not
      # have to change code.
      - key: FC_SANDBOX_TEMPLATE
        value: code-interpreter-v1
      # The sandbox's own lifetime in milliseconds (default 3600000). It is a
      # BUDGET, not a timeout to tune away: `start_session` asserts the
      # remaining budget exceeds the whole expected training wait before it
      # pauses, so a value shorter than a training run makes every session
      # refuse at step 7 rather than expire silently mid-hibernation.
      - key: FC_SANDBOX_TIMEOUT_MS
        value: 3600000

  # -------------------------------------------------------------------------
  # 3. The web app — public. Talks only to the API, never to Postgres.
  # -------------------------------------------------------------------------
  - type: web
    name: flashml-web
    # Deploys gated by CI — see the note on flashml-coordinator above and
    # .github/workflows/ci.yml.
    autoDeploy: false
    runtime: node
    rootDir: flashml-cloud/apps/web
    plan: free             # may sleep; only the API and coordinator must not
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      # Must be NEXT_PUBLIC_CLOUD_API, not NEXT_PUBLIC_API_BASE: that is the
      # only var name `apps/web/lib/cloud-api.ts` (`cloudApiBase()`) reads.
      #
      # AN EXPLICIT URL, not `fromService: {property: host}`, as of 2026-08-01.
      #
      # NEXT_PUBLIC_* values are inlined by Next.js at BUILD time. A
      # `fromService` reference that does not resolve during the build yields
      # an empty string, which is baked in permanently — and nothing fails.
      # The site serves, sign-in works (Supabase uses its own `sync: false`
      # vars, which is why those were fine while this one was not), and the
      # breakage appears only when a signed-in user loads a page that calls
      # the API: a bare "Failed to fetch", with no hint that a deploy-time
      # value is missing. That is what happened here.
      #
      # A literal costs one edit if the API's hostname ever changes, and that
      # edit is visible in a diff. Silence was the expensive part.
      #
      # apps/web/next.config.ts now refuses to complete a production build
      # when this is missing or empty, so a recurrence fails at build time
      # with a message naming the variable, instead of shipping.
      - key: NEXT_PUBLIC_CLOUD_API
        value: https://api.zolliai.com
      # ONLY the anon key reaches the browser. The service-role key and the
      # operator token must never appear in a NEXT_PUBLIC_* var or a bundle —
      # a leaked service key bypasses every ownership check the API performs.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

  # ===========================================================================
  # DEV ENVIRONMENT — three FREE services on the `develop` branch.
  #
  # Added 2026-08-02. Same blueprint on purpose: Render reads `render.yaml` at
  # the repo root and nowhere else, so a separate `render.dev.yaml` would be
  # inert documentation. One file, one diff, both environments.
  #
  # WHAT DEV DELIBERATELY GIVES UP, and why it is acceptable:
  #
  #   1. The coordinator is `type: web`, NOT `pserv`. Render's free tier has
  #      no private services. So dev's coordinator is PUBLIC, and its operator
  #      token — which is unscoped and can act as any machine — is reachable
  #      by anyone who finds the URL. In dev, with throwaway data and its OWN
  #      generated token, that is contained. It is NOT acceptable in prod, and
  #      the prod service above stays `pserv`. Do not copy this downward.
  #
  #   2. No disk. Free tier has none. `leases.db` and locally-hosted artifacts
  #      go to ephemeral storage and are LOST on every spin-down and redeploy.
  #      A run that spans a restart dies. Accepted deliberately by the owner.
  #      Bonus: this exercises the parked diskless-coordinator design (Plan
  #      B2) for real, instead of settling it by argument.
  #
  #   3. Free services sleep after ~15 minutes idle. Not the problem it looks
  #      like: an agent polling for leases IS inbound traffic, so the service
  #      stays awake for as long as a test is actually running. Sleeping costs
  #      one slow request between sessions.
  #
  #      It is also what keeps this free — free instances share 750 hours per
  #      MONTH across all of them, and three always-on services would burn
  #      that in about ten days.
  #
  # Dev therefore proves the multi-machine loop, which localhost cannot (no
  # other machine can reach your laptop). It does NOT rehearse a prod deploy:
  # different topology, no disk. Blueprint changes still get proven on prod.
  #
  # autoDeploy is TRUE here, unlike prod. Dev is for fast iteration and there
  # is nothing to protect; CI still runs on the branch, so a red build is
  # visible. Migrations are applied to dev by the `migrate-dev` job in
  # .github/workflows/ci.yml on every push to `develop`.
  # ===========================================================================

  - type: web
    name: flashml-dev-coordinator
    runtime: python
    branch: develop
    autoDeploy: true
    rootDir: .
    plan: free
    region: oregon
    # One of the four pin sites — see the prod coordinator's buildCommand.
    # Dev running a different runtime than prod would make dev worthless as a
    # rehearsal, which is the only reason it exists.
    buildCommand: pip install "flashruntime[service]==0.6.1"
    startCommand: >-
      FLASHML_OPERATOR_TOKENS="flashml-dev-api:$OPERATOR_TOKEN"
      uvicorn flashruntime.service.app:app
      --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      # Its OWN token, generated separately. Never share prod's — a public
      # service holding the prod operator credential would let anyone act as
      # every machine in production.
      - key: OPERATOR_TOKEN
        generateValue: true
      - key: FLASHML_REQUIRE_NODE_AUTH
        value: "1"
      # /tmp, not /data: there is no disk. Both are lost on restart; naming
      # them under /tmp says so honestly rather than implying persistence.
      - key: FLASHML_LEDGER_PATH
        value: /tmp/flashml/ledger.db
      - key: FLASHML_LOCAL_ARTIFACTS_DIR
        value: /tmp/flashml/artifacts
      - key: FLASHML_ENABLE_KUBERAY
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: flashml-dev-api
    runtime: python
    branch: develop
    autoDeploy: true
    rootDir: flashml-cloud/apps/api
    plan: free
    region: oregon
    buildCommand: pip install -e .
    startCommand: uvicorn flashml_cloud_api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: REQUIRE_AUTH
        value: "1"
      # An explicit https:// URL, NOT `fromService … property: host`.
      #
      # `host` yields a bare hostname with no scheme, and settings.py then
      # prepends `http://` — correct for prod, where the coordinator is a
      # PRIVATE service on an internal network that does not terminate TLS.
      # Dev's coordinator is PUBLIC, and Render answers plain http with a
      # 301 to https. `httpx.AsyncClient` does not follow redirects by
      # default and the proxy does not ask it to, so every agent call would
      # have come back as a 301 (verified against the live service
      # 2026-08-02).
      #
      # Fixed here rather than by enabling follow_redirects on the client:
      # that request carries the unscoped OPERATOR token, and a proxy that
      # chases redirects while holding a credential is a much worse thing to
      # own than one hardcoded URL.
      #
      # Not a secret — it is this service's own public address.
      - key: COORDINATOR_URL
        value: https://flashml-dev-coordinator.onrender.com
      - key: COORDINATOR_OPERATOR_TOKEN
        fromService:
          type: web
          name: flashml-dev-coordinator
          envVarKey: OPERATOR_TOKEN
      # The DEV Supabase project, not prod. sync: false like the production
      # service above — Render prompts once and the ref never enters git.
      # Getting this wrong points dev at the production database, so check it
      # against the dashboard rather than pasting from memory.
      - key: SUPABASE_URL
        sync: false
      # sync: false => Render prompts once and never stores it in git.
      # Get it from Supabase -> flashml-dev -> Settings -> Database ->
      # Connection string — TRANSACTION pooler, :6543, user postgres.<ref>.
      # Not :5432: its 15-client session cap is what took dev down on
      # 2026-08-13 (see the prod DATABASE_URL comment above for the full
      # story and the prepare_threshold=None guard this depends on).
      - key: DATABASE_URL
        sync: false
      # Where a machine is told to go to approve its device code. Unset
      # until 2026-08-04, and the fallback is a RELATIVE "/activate" — which
      # is printed by `flashnode login` into a terminal on someone else's
      # laptop, where there is no current host to make it relative to. The
      # volunteer got "Approve at: /activate" and no way to guess the rest.
      # An explicit URL, for the same reason COORDINATOR_URL above is one.
      - key: FLASHML_CONSOLE_URL
        value: https://flashml-dev-web.onrender.com
      # See the long note on the prod service. Dev needs this MORE, not less:
      # its coordinator is `type: web` rather than `pserv`, so a sandbox could
      # technically reach it — and then fail on the machine token instead,
      # which is the more confusing of the two failures.
      - key: FLASHML_PUBLIC_API_URL
        value: https://flashml-dev-api.onrender.com
      - key: PYTHON_VERSION
        value: "3.11"
      # Mail. The API sends two product emails — access approved and access
      # declined. Absent, it boots and serves and sends nothing: a missing
      # provider must not take the API down, so these are NOT in
      # settings.from_env's required list.
      #
      # Supabase's own SMTP setting is separate and governs AUTH mail
      # (password reset, confirmation) — it is configured in the Supabase
      # dashboard, not here, and points at the same Resend account.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "FlashML <no-reply@zolliai.com>"
      # MUST be a mailbox that actually RECEIVES mail. Resend's domain
      # verification proves `zolliai.com` can SEND — DKIM plus an SPF/MX pair
      # on the `send.` subdomain for bounces — and says nothing about
      # receiving. Verified 2026-08-10: `zolliai.com` has NO MX record, so no
      # address at that domain receives anything today. The declined email's
      # only call to action is "reply to this message" (re-applying is
      # refused by design, see `access-request` 409), so an unresolved
      # reply-to strands exactly the person who most needs a way back in.
      #
      # RESOLVED 2026-08-10: the owner's own monitored inbox. Deliberately
      # NOT an @zolliai.com address — no Workspace account exists on that
      # domain, so any address there would be send-only and would bounce.
      # Reply-To need not sit on the verified sending domain: DKIM/SPF
      # govern `From`, while `Reply-To` only redirects the recipient's
      # reply. Recipients still see "FlashML" as the sender.
      #
      # Swap this for a real support address the day Workspace (or a free
      # forwarder) lands on zolliai.com — one env var, no code change.
      - key: EMAIL_REPLY_TO
        value: "phongct1105@gmail.com"

      # -- GitHub App: reading a submitter's PRIVATE repositories -----------
      #
      # All three or none. `Settings.github_app_configured` is all-or-nothing
      # on purpose: a half-configured App can mint no token, and reporting it
      # as configured would have the console render a Connect button that
      # walks somebody through granting us access to their code and then
      # fails. Absent, private repos are simply unavailable and public ones
      # work exactly as before — so, like the mail vars above, these are NOT
      # in settings.from_env's required list.
      #
      # This is a SECOND GitHub registration, unrelated to Supabase's GitHub
      # sign-in provider. Supabase stays identity-only. An OAuth `repo` scope
      # would be all-or-nothing, tied to one person's account, and would
      # tangle sign-in with authorization — see the spec's §1.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      # The App's RSA private key. Multi-line PEM: Render's dashboard accepts
      # newlines, but a `.env` file does not, so `_decode_pem` also accepts
      # base64 — store it base64-encoded and one format works everywhere.
      #
      # This is the credential the whole design hangs on. The database holds
      # only installation ids, which are useless without this key; leak it and
      # every connected organisation's private source is readable.
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false

      # -- Alibaba OSS: the artifact mirror ---------------------------------
      #
      # All five or none, exactly as on the production API above — read that
      # block for what the mirror is and why the names are load-bearing.
      #
      # DEV IS WHERE THIS MATTERS MOST, not least. The prod coordinator has a
      # 5 GB disk; this environment's coordinator has NO DISK AT ALL (free
      # tier), so `FLASHML_LOCAL_ARTIFACTS_DIR` points at /tmp and every
      # committed artifact is destroyed on every spin-down and redeploy. A
      # model that survives an hour of hibernation and then does not survive
      # a deploy is not stored, it is cached. Left unset, dev keeps exactly
      # that behaviour and nothing else changes.
      #
      # Point these at a DIFFERENT bucket from production, and at a RAM key
      # scoped to it. Dev's coordinator is a PUBLIC service holding an
      # unscoped operator token (see the environment's header comment); a
      # credential shared with prod would put production artifacts behind it.
      - key: OSS_BUCKET
        sync: false
      - key: OSS_ENDPOINT
        value: oss-ap-southeast-1.aliyuncs.com
      - key: OSS_REGION
        value: ap-southeast-1
      - key: OSS_ACCESS_KEY_ID
        sync: false
      - key: OSS_ACCESS_KEY_SECRET
        sync: false

      # -- Alibaba FC Agent Sandbox: the evaluation session -----------------
      #
      # Read the production API's block above for what this is and why the
      # region is an allowlist of one. The same rules apply here with two
      # differences, and both cost money rather than correctness:
      #
      # POINT THIS AT A DIFFERENT POOL AND A DIFFERENT KEY FROM PRODUCTION.
      # `FC_SANDBOX_POOL_ID` names a pool the session requires to be EMPTY;
      # sharing one with prod means whichever environment opens a session
      # second is refused, and sharing the API key puts both environments'
      # sandboxes behind one credential.
      #
      # AN UNCONFIGURED DEV IS THE SAFE DEFAULT. Leaving these blank is not a
      # degraded mode — the routes 404, the reconciler does not start, and
      # nothing else differs. Setting them on a free instance that spins down
      # is the arrangement worth thinking about: the reconciler is what kills
      # a sandbox whose controller died, and a service that is asleep is a
      # service not reconciling. It sweeps at startup for that reason, so a
      # spun-down dev API settles its leaks on the next request that wakes it
      # — but a sandbox created here and then abandoned bills against a real
      # Alibaba account until then.
      - key: E2B_API_KEY
        sync: false
      # A literal, for the reason spelled out on the prod service: a typed
      # region does not fail the deploy, it fails as 403 PauseSessionForbidden
      # long afterwards, with a sandbox billing by the second. Not a secret,
      # one correct answer, so it lives in version control.
      - key: E2B_REGION
        value: ap-southeast-1
      # The one secret. `E2B_API_KEY` and NOT `FC_SANDBOX_API_KEY`: the
      # sandbox speaks the E2B protocol, and `Settings.from_env` reads
      # Alibaba's own variable names so a value copied out of their console
      # or docs lands where it is expected.
      #
      # Deliberately NOT shared with prod. This key creates sandboxes, kills
      # them and reads their metadata, with no scope narrower than that.
      - key: E2B_API_KEY
        sync: false
      # Declared rather than left to the default, because it is the value
      # `api_url` and `domain` are DERIVED from when those are unset — so a
      # wrong region here silently points a Singapore key at another
      # continent's endpoint, which Alibaba's docs warn fails at
      # authentication, template lookup, creation and connection alike.
      #
      # Singapore is also one of the eight regions where FC Agent Sandbox
      # exists at all (cn-beijing, cn-shanghai, cn-hangzhou, cn-shenzhen,
      # cn-hongkong, ap-southeast-1, us-east-1, us-west-1).
      - key: E2B_REGION
        value: ap-southeast-1
      - key: FC_SANDBOX_POOL_ID
        sync: false
      - key: FC_SANDBOX_TEMPLATE
        value: code-interpreter-v1
      - key: FC_SANDBOX_TIMEOUT_MS
        value: 3600000

  - type: web
    name: flashml-dev-web
    runtime: node
    branch: develop
    autoDeploy: true
    rootDir: flashml-cloud/apps/web
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      # Inlined at BUILD time, so it must point at the DEV api or the dev
      # console will talk to production.
      - key: NEXT_PUBLIC_CLOUD_API
        value: https://flashml-dev-api.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # Only the anon/publishable key ever reaches the browser — and it stays
      # out of git regardless, matching how the prod service above handles it.
      # Render prompts once at blueprint sync. Get it from Supabase ->
      # flashml-dev -> Settings -> API keys -> publishable.
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
