[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashml-cloud-api"
version = "0.1.0"
description = "FlashML Cloud control-plane API: node registry, job submission, timelines. Private."
requires-python = ">=3.10"
dependencies = [
    "flashruntime>=0.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["flashml_cloud_api*"]
