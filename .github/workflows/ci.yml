# CI for Zolli-Labs/flashml-cloud.
#
# WHY THIS FILE IS AT THE REPOSITORY ROOT: GitHub reads workflows from
# `.github/workflows/` at the root and NOWHERE else. A copy under
# `flashml-cloud/` would be inert — which is not hypothetical, it is exactly
# the mistake the public repo made (flashruntime/.github/workflows/ never ran
# a single job until it was moved up).
#
# WHAT CHANGED, 2026-08-02: until today this repository had NO CI, while all
# three Render services deployed from `main` on every commit with
# `autoDeployTrigger: commit`. Untested code shipped itself to production.
#
# Deploys are now OWNED BY THIS FILE. `render.yaml` sets `autoDeploy: false`
# on all three services, and the deploy jobs below call the Render API after
# the test jobs pass. That inversion is deliberate: Render's own
# `checksPass` trigger would do the same thing, but it is a dashboard setting
# that cannot be expressed in the blueprint, so it could not be reviewed in a
# diff or verified from version control. See
# docs/superpowers/specs/2026-08-02-ci-cd-and-environments-design.md §2.1.
#
# Break-glass: a manual deploy from the Render dashboard still works and is
# the documented path when GitHub Actions is unavailable.

name: ci

on:
  push:
  pull_request:

# A newer push to the same ref makes the older run irrelevant — except on
# main, where a cancelled run could leave a half-finished deploy sequence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.11"   # keep equal to PYTHON_VERSION in render.yaml

jobs:
  # ---------------------------------------------------------------------------
  # The control plane. 419 tests, including every migration applied to a real
  # PostgreSQL by tests/conftest.py.
  # ---------------------------------------------------------------------------
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # tests/conftest.py starts its OWN throwaway PostgreSQL with
      # initdb/pg_ctl rather than talking to a server we provide, so a
      # `services: postgres:` container would not satisfy it — the BINARIES
      # have to be on PATH. GitHub's runner image ships PostgreSQL but leaves
      # its bin directory off PATH.
      #
      # Discovered, not hardcoded: pinning /usr/lib/postgresql/16/bin here
      # would break silently the day the runner image moves to 17, and the
      # failure would read as "initdb not found" long after this file was
      # last touched.
      - name: Put the PostgreSQL binaries on PATH
        run: |
          set -euo pipefail
          pgbin="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)"
          test -n "$pgbin" || { echo "no PostgreSQL bin directory on this runner"; exit 1; }
          echo "$pgbin" >> "$GITHUB_PATH"
          echo "using $pgbin"

      - name: Verify the binaries conftest.py requires
        run: |
          set -euo pipefail
          for b in initdb pg_ctl pg_isready psql; do
            command -v "$b" >/dev/null || { echo "missing required binary: $b"; exit 1; }
          done
          initdb --version

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: flashml-cloud/apps/api
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/flashml-cloud/apps/api/.venv

      - name: pytest
        working-directory: flashml-cloud/apps/api
        run: .venv/bin/python -m pytest -q

  # ---------------------------------------------------------------------------
  # The console. Build + vitest.
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashml-cloud/apps/web
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: react-dom/client reads `navigator` at import time, and
      # globalThis.navigator only exists from Node 21. On 20 every test that
      # mounts a client root dies with "navigator is not defined" — a failure
      # that cannot reproduce on a developer machine running 22.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: flashml-cloud/apps/web/package-lock.json

      - run: npm ci

      # NEXT_PUBLIC_* values are inlined at BUILD time, and next.config.ts
      # deliberately FAILS a production build when this is missing. That guard
      # exists because an empty value was once baked into a bundle and showed
      # up only as "Failed to fetch" on every signed-in page.
      #
      # Not a secret: it is already a literal in render.yaml.
      - run: npm run build
        env:
          NEXT_PUBLIC_CLOUD_API: https://api.zolliai.com

      - run: npm test

  # ---------------------------------------------------------------------------
  # The whole loop against the PINNED public artifacts — the drift detector
  # between this repo and Zolli-Labs/flashml.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # The pins live in the Makefile (RUNTIME_PIN / NODE_PIN), so the
          # cache must turn over when they do. This job also pulls torch,
          # numpy, scikit-learn, pandas and scipy — without a cache it is by
          # far the longest job here.
          cache-suffix: e2e-${{ hashFiles('Makefile') }}

      - name: Install pinned runtime + agent
        run: make e2e-setup

      # PATH, not just the venv interpreter: `.venv/bin/python -m pytest` does
      # NOT put the venv's bin on PATH, and at least one test spawns a bare
      # `python`. Getting this wrong produces a confusing failure that looks
      # like a missing dependency.
      - name: pytest
        run: PATH="$PWD/e2e/.venv/bin:$PATH" make e2e

  # ---------------------------------------------------------------------------
  # Credentials must not reach this repository.
  # ---------------------------------------------------------------------------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history, not just the tip — gitleaks needs the range

      # The BINARY, not gitleaks/gitleaks-action@v2.
      #
      # That action refuses to run for organizations without a paid licence,
      # and Zolli-Labs is one. Its first run here failed in 7 seconds:
      #
      #   "[Zolli-Labs] is an organization. License key is required."
      #
      # The gitleaks tool itself is MIT-licensed and free; only the Action
      # wrapper is gated. So install the release binary and call it directly.
      #
      # --redact so a finding never prints the secret it found into a log that
      # is far more widely readable than the commit it came from.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the full history
        run: gitleaks git . --redact --verbose

  # ---------------------------------------------------------------------------
  # DEV migrations. Automatic, unlike prod — dev is for iteration and there is
  # nothing there to protect.
  #
  # Only the migrations run here. The three dev services carry
  # `autoDeploy: true` in render.yaml, so Render redeploys them on this same
  # push without needing RENDER_API_KEY. The two are therefore concurrent
  # rather than ordered: a deploy can briefly come up against a database that
  # is one migration behind.
  #
  # That used to be tolerable across the board because the code paths that
  # touch new tables failed soft. It is NOT tolerable for migration 0007
  # (pools): `profile_is_admitted` gates /me plus four other routes, and
  # `list_pool_job_ids_for_member` backs /jobs, and neither has a
  # try/except — a deploy that lands before 0007 finishes applying will
  # 500 on those routes instead of degrading. After pushing to develop,
  # watch `migrate-dev` through to completion before touching the dev
  # console. Do NOT carry this looseness into prod, where deploy-prod.yml
  # migrates first and deploys only afterwards.
  # ---------------------------------------------------------------------------
  migrate-dev:
    needs: [api]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: flashml-cloud/apps/api
        run: |
          uv venv .venv
          uv pip install -e .
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/flashml-cloud/apps/api/.venv

      - name: What is pending
        working-directory: flashml-cloud/apps/api
        run: .venv/bin/python -m flashml_cloud_api.migrate --dry-run || true
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Apply
        working-directory: flashml-cloud/apps/api
        run: .venv/bin/python -m flashml_cloud_api.migrate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

# ---------------------------------------------------------------------------
# PRODUCTION DEPLOYS LIVE HERE AGAIN (2026-08-11).
#
# History, because the reversal matters. They were here, then moved out: the
# gate was meant to be `environment: production` with a required reviewer, and
# GitHub REFUSED to create the rule (2026-08-02, HTTP 422):
#
#   "Failed to create the environment protection rule. Please ensure the
#    billing plan supports the required reviewers protection rule."
#
# Zolli-Labs is on GitHub Free, where environment protection rules are
# unavailable for PRIVATE repositories. A bare `production` environment can be
# created but enforces nothing, which is worse than no gate because it looks
# like one. So prod deploys became a separate manually-dispatched workflow.
#
# The repository went PUBLIC on 2026-08-11 and the owner asked for automatic
# deploys on main. The gate that replaces the manual dispatch is the test
# suite itself: `migrate-prod` needs api, web, e2e AND secrets, so nothing
# reaches production that has not passed everything CI runs. That is a
# stronger guarantee than the pre-2026-08-02 arrangement this file was written
# to fix, where Render's own `autoDeploy` fired on every commit with no tests
# at all.
#
# `.github/workflows/deploy-prod.yml` is KEPT as break-glass: redeploying
# without a push, or deploying with `skip_migrations`, still needs it.
#
# NOT using `environment: production` here on purpose. Required reviewers are
# now available (public repo), and adding one is a one-line change — but a
# bare environment with no rule attached is the fake gate this file already
# argued against. Add the rule and the key together, or neither.
# ---------------------------------------------------------------------------

  migrate-prod:
    # Every test job, not just `api`. migrate-dev needs only `api` because dev
    # is disposable; a prod migration is the one step in this pipeline that a
    # redeploy cannot undo.
    needs: [api, web, e2e, secrets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: flashml-cloud/apps/api
        run: |
          uv venv .venv
          uv pip install -e .
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/flashml-cloud/apps/api/.venv

      - name: What is pending
        working-directory: flashml-cloud/apps/api
        run: .venv/bin/python -m flashml_cloud_api.migrate --dry-run || true
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Apply
        working-directory: flashml-cloud/apps/api
        run: .venv/bin/python -m flashml_cloud_api.migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  deploy-prod:
    # Migrations FIRST, deploy after — never concurrent. dev tolerates the
    # race (render.yaml's dev block says so, and 0007's try/except absorbs it);
    # prod must not, or the API comes up against a schema it does not expect.
    needs: [migrate-prod]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Service ids are not secrets and are literal on purpose: one is useless
      # without RENDER_API_KEY, and hiding them would only make this file
      # harder to read against the Render dashboard. Same ids as
      # deploy-prod.yml — if one moves, both move.
      #
      # ORDER IS LOAD-BEARING. The coordinator goes first: the API will not
      # serve without one behind it.
      - name: Deploy coordinator
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-d9mts2u417fc73c7l5g0/deploys" \
            -d '{}' > /dev/null
          echo "coordinator deploy triggered"

      - name: Deploy API
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-d9mtspu417fc73c7mip0/deploys" \
            -d '{}' > /dev/null
          echo "api deploy triggered"

      - name: Deploy web
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-d9mtt9e417fc73c7ni30/deploys" \
            -d '{}' > /dev/null
          echo "web deploy triggered"
