# gitleaks configuration for Zolli-Labs/flashml-cloud.
#
# Scanned in CI by the `secrets` job in .github/workflows/ci.yml, over the
# FULL history, on every push and pull request.
#
# A note on why this file is deliberately small. The temptation with a secret
# scanner is to silence it by excluding `tests/` wholesale, at which point it
# no longer scans the files most likely to contain a copy-pasted real
# credential. So the allowlist below names ONE literal string. Any other
# high-entropy value, in any file including these same test files, still
# fails the build.

[extend]
useDefault = true

[allowlist]
description = """
The HS256 signing secret used by the API test suite.

Four findings, all the same literal, introduced 2026-08-01 in
test_settings.py, test_jobs_from_repo.py, test_jobs.py and
test_agent_proxy.py. It is a fixture: the tests mint browser JWTs with it and
verify the API rejects tokens signed by anything else. It has never been a
real key, and the string says so.

Verified separately, and the reason this file does not simply disable the
rule: NEITHER of the two real Supabase DATABASE_URL passwords used by this
project appears in any commit (`git log --all -S<password>` -> 0 for both),
and `.env` has never been tracked. The only credentials in this history are
the ones named right here.
"""
regexes = [
  '''test-jwt-secret-long-enough-for-hs256(-abcdef)?''',
]
