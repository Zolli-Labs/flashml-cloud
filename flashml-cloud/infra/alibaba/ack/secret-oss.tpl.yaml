# Rendered by scripts/alibaba/render.sh from .env.alibaba. The rendered file
# lives only in the gitignored build/ directory. For production, prefer RRSA
# (RAM Roles for Service Accounts) over long-lived keys.
apiVersion: v1
kind: Secret
metadata:
  name: flashml-artifact-credentials
  namespace: flashml
type: Opaque
stringData:
  FLASHML_ARTIFACT_ACCESS_KEY: "${OSS_ACCESS_KEY_ID}"
  FLASHML_ARTIFACT_SECRET_KEY: "${OSS_ACCESS_KEY_SECRET}"
  FLASHML_ARTIFACT_SECURITY_TOKEN: "${OSS_SECURITY_TOKEN}"
