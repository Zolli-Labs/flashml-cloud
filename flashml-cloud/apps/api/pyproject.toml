[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashml-cloud-api"
version = "0.1.0"
description = "FlashML Cloud control-plane API: node registry, job submission, timelines. Private."
requires-python = ">=3.10"
dependencies = [
    # flashruntime lives in the PUBLIC Zolli-Labs/flashml monorepo and ships to
    # PyPI from a tag. It is no longer a directory in this repo, and there is
    # no relative-path install anywhere — that duplication is what let the
    # deployed API and a volunteer's agent run different code without anyone
    # noticing.
    #
    # An EXACT version, not a range: this API and the coordinator must run the
    # same protocol. A range lets a rebuild of one service pick up a new
    # runtime while the other stays put, which is the drift this whole
    # migration removed, reintroduced through the back door.
    #
    # Change this in render.yaml and the Makefile's FLASHML_PIN at the same
    # time. See docs/superpowers/specs/2026-08-01-foundation-design.md §3.3.
    "flashruntime==0.3.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # [crypto] pulls in `cryptography`, which PyJWT needs for ES256 — the
    # algorithm every token from an asymmetric-key Supabase project carries.
    # Plain `pyjwt` cannot verify one at all.
    "pyjwt[crypto]>=2.8",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["flashml_cloud_api*"]
