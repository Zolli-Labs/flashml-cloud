[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashml-cloud-api"
version = "0.1.0"
description = "FlashML Cloud control-plane API: node registry, job submission, timelines. Private."
requires-python = ">=3.10"
dependencies = [
    # flashruntime lives in the PUBLIC Zolli-Labs/flashml monorepo and ships to
    # PyPI from a tag. It is no longer a directory in this repo, and there is
    # no relative-path install anywhere — that duplication is what let the
    # deployed API and a volunteer's agent run different code without anyone
    # noticing.
    #
    # An EXACT version, not a range: this API and the coordinator must run the
    # same protocol. A range lets a rebuild of one service pick up a new
    # runtime while the other stays put, which is the drift this whole
    # migration removed, reintroduced through the back door.
    #
    # Change this in render.yaml (BOTH coordinators, prod and dev) and the
    # Makefile's RUNTIME_VERSION at the same time — four sites, not three.
    # See docs/superpowers/specs/2026-08-01-foundation-design.md §3.3.
    #
    # 0.4.1 is what makes `resources.gpus` real. On 0.4.0 `ResourcesSpec` had
    # no `gpuPerTask`, so `compile_to_jobspec`'s `model_validate` dropped the
    # field under pydantic's default `extra="ignore"` — no error, and a GPU
    # job placed on a GPU-less host.
    #
    # 0.4.2 carries `ExecutionEvidence` on `CompleteRequest`, which is what
    # makes verification slice 2 more than dead code: agents on flashnode
    # 0.3.3 send it, and a coordinator on 0.4.1 drops it under that same
    # `extra="ignore"` — evidence collected on the host and discarded on
    # arrival, with nothing to say so. It also carries the fedavg influence
    # cap and node exclusion, the sixth placement gate.
    #
    # 0.4.3 opens `PlacementSpec.pool` from a closed Literal to a plain
    # `str`, which is the seventh placement gate: on 0.4.2 a pool id other
    # than the built-in literals fails validation before it ever reaches the
    # coordinator, so team pools cannot resolve at all. `CommandRecipe.expand`
    # also gains the `allowFallback`-iff-`pool` rule this API's compile layer
    # depends on.
    "flashruntime==0.6.0",
    "fastapi>=0.111",
    # Starlette's multipart parser, and the ONLY reason it is here:
    # `POST /v1alpha1/jobs/from-upload` takes a working tree as a file part.
    # Starlette does not vendor a parser — `request.form()` asserts on this
    # package's absence — so without it that route answers 500 for every
    # correct request, which is the single private-code path this product
    # has. Not an extra: an install that skipped it would look healthy at
    # startup and fail only at the first upload.
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # [crypto] pulls in `cryptography`, which PyJWT needs for ES256 — the
    # algorithm every token from an asymmetric-key Supabase project carries.
    # Plain `pyjwt` cannot verify one at all.
    "pyjwt[crypto]>=2.8",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    # Alibaba OSS, for the artifact mirror (`alibaba_oss.py`,
    # `artifact_mirror.py`). A hard dependency rather than an extra: it is
    # imported lazily and every OSS path is gated on `settings.oss_configured`,
    # so an unconfigured deploy neither imports it nor behaves differently —
    # but a CONFIGURED deploy that is merely missing the wheel would fail at
    # the first accepted commit rather than at startup, which is the worst
    # possible time to discover a packaging gap.
    "oss2>=2.18",
    # Alibaba FC Agent Sandbox, which speaks the E2B protocol rather than an
    # Alibaba-specific one — `alibaba_sandbox.py` drives it through the E2B
    # SDK and Alibaba's own docs use `E2B_API_KEY` / `E2B_API_URL` /
    # `E2B_DOMAIN` and the built-in `code-interpreter-v1` template.
    #
    # Here for exactly the reason `oss2` is, one step worse. The import is
    # lazy (`alibaba_sandbox.py` imports `Sandbox` inside the method) and
    # every path is gated on `settings.fc_sandbox_configured`, so an
    # unconfigured deploy neither imports it nor behaves differently. But a
    # CONFIGURED deploy missing the wheel raises "e2b-code-interpreter is not
    # installed" at the first evaluation — after a training job has already
    # been accepted and run.
    #
    # EXACT versions, not ranges, and not a preference: these two are the
    # pair Alibaba pins as validated against FC Agent Sandbox, and the
    # module's own docstring already names them. `_status_from_message`
    # parses `e2b.api.handle_api_exception`'s formatting, which is the most
    # likely thing here to break on an unattended upgrade.
    "e2b==2.31.0",
    "e2b-code-interpreter==2.8.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["flashml_cloud_api*"]

[tool.pytest.ini_options]
# `network` reaches the public internet (GHCR). Deselected by default so the
# suite runs offline; CI runs it with `-m network`. It is the only check that
# proves a volunteer with no credentials can actually pull the curated images
# — the thing that was broken for fourteen hours while every offline
# assertion about them passed.
addopts = "-m 'not network'"
markers = [
    "network: reaches the public internet; excluded by default, run with -m network",
]
