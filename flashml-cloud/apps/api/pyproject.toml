[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashml-cloud-api"
version = "0.1.0"
description = "FlashML Cloud control-plane API: node registry, job submission, timelines. Private."
requires-python = ">=3.10"
dependencies = [
    # flashruntime lives in the PUBLIC Zolli-Labs/flashml monorepo. It is no
    # longer a directory in this repo, and there is no relative-path install
    # anywhere — that duplication is what let the deployed API and a
    # volunteer's agent run different code without anyone noticing.
    #
    # This is a COMMIT pin, not a version pin, and that is deliberate for now:
    # flashruntime 0.3.0 is not on PyPI yet (the name has never been
    # published). The repo is public, so this resolves with no credentials.
    #
    # REPLACE WITH `flashruntime==0.3.0` once the release lands. A commit pin
    # is fine on main and must not survive into a tagged release of this
    # service — see docs/superpowers/specs/2026-08-01-foundation-design.md §3.3.
    "flashruntime @ git+https://github.com/Zolli-Labs/flashml@383efaab74196c6d86bcb6517e6ee20403a00e1a#subdirectory=flashruntime",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # [crypto] pulls in `cryptography`, which PyJWT needs for ES256 — the
    # algorithm every token from an asymmetric-key Supabase project carries.
    # Plain `pyjwt` cannot verify one at all.
    "pyjwt[crypto]>=2.8",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["flashml_cloud_api*"]
